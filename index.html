<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Carnes</title>

<style>
body { font-family: Arial; background:#f0f0f0; padding:20px; }
h2 { color:#c0392b; }

.form-box, .tabla-box {
  background:white; padding:20px; border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:20px;
}

input { padding:8px; margin:5px; }

button {
  padding:10px; border:none; border-radius:5px;
  cursor:pointer; margin:5px;
}
.btn-guardar{background:#c0392b;color:white;}
.btn-excel{background:#27ae60;color:white;}
.btn-mail{background:#2980b9;color:white;}
.btn-borrar{background:#888;color:white;}

table{width:100%; border-collapse:collapse;}
th,td{padding:8px; border-bottom:1px solid #ddd;}
</style>
</head>

<body>

<h2>Registro Diario de Carnes</h2>

<div class="form-box">
<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<input id="corte" placeholder="Corte">
<input id="peso" type="number" placeholder="Peso">

<br>

<button class="btn-guardar" onclick="guardar()">Guardar</button>
<button class="btn-excel" onclick="descargarExcel()">Excel</button>
<button class="btn-mail" onclick="enviarMail()">Enviar Mail</button>
<button class="btn-borrar" onclick="borrar()">Borrar</button>
</div>

<div class="tabla-box">
<table>
<thead>
<tr>
<th>#</th><th>Fecha</th><th>Hora</th>
<th>Nombre</th><th>Apellido</th><th>Corte</th><th>Peso</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script>

// ===== BASE DATOS =====
function getDB(){
  return JSON.parse(localStorage.getItem("carnes_db") || "[]");
}

function setDB(db){
  localStorage.setItem("carnes_db", JSON.stringify(db));
}

// ===== FECHA =====
function hoy(){
  return new Date().toISOString().split("T")[0];
}

function hora(){
  return new Date().toLocaleTimeString();
}

// ===== OBTENER DIA ACTUAL =====
function getDiaActual(){
  let db = getDB();
  let f = hoy();

  let dia = db.find(d => d.fecha === f);

  if(!dia){
    dia = {fecha:f, enviado:false, registros:[]};
    db.push(dia);
  }

  // mantener solo últimos 5 días
  if(db.length > 5){
    db = db.slice(-5);
  }

  setDB(db);
  return dia;
}

// ===== GUARDAR =====
function guardar(){
  let n = nombre.value.trim();
  let a = apellido.value.trim();
  let c = corte.value.trim();
  let p = parseFloat(peso.value);

  if(!n || !a || !c || !p){
    alert("Completar campos");
    return;
  }

  let db = getDB();
  let dia = getDiaActual();

  dia.registros.push({
    fecha:hoy(),
    hora:hora(),
    nombre:n,
    apellido:a,
    corte:c,
    peso:p
  });

  setDB(db);
  render();

  nombre.value="";
  apellido.value="";
  corte.value="";
  peso.value="";
}

// ===== TABLA =====
function render(){
  let dia = getDiaActual();
  let html="";

  dia.registros.forEach((r,i)=>{
    html+=`<tr>
      <td>${i+1}</td>
      <td>${r.fecha}</td>
      <td>${r.hora}</td>
      <td>${r.nombre}</td>
      <td>${r.apellido}</td>
      <td>${r.corte}</td>
      <td>${r.peso}</td>
    </tr>`;
  });

  tabla.innerHTML = html || "<tr><td colspan='7'>Sin datos</td></tr>";
}

// ===== EXCEL =====
function generarExcel(){
  let dia = getDiaActual();

  if(dia.registros.length===0){
    alert("Sin datos");
    return null;
  }

  let filas="";
  dia.registros.forEach((r,i)=>{
    filas+=`<tr>
    <td>${i+1}</td>
    <td>${r.fecha}</td>
    <td>${r.hora}</td>
    <td>${r.nombre}</td>
    <td>${r.apellido}</td>
    <td>${r.corte}</td>
    <td>${r.peso}</td>
    </tr>`;
  });

  return `
  <html>
  <table border="1">
  <tr>
  <th>#</th><th>Fecha</th><th>Hora</th>
  <th>Nombre</th><th>Apellido</th><th>Corte</th><th>Peso</th>
  </tr>
  ${filas}
  </table>
  </html>`;
}

function descargarExcel(){
  let html = generarExcel();
  if(!html) return;

  let blob = new Blob([html], {type:'application/vnd.ms-excel'});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "registro.xls";
  a.click();
}

// ===== MAIL =====
function enviarMail(){
  let html = generarExcel();
  if(!html) return;

  descargarExcel();

  let asunto = "Registro Carnes";
  let cuerpo = "Adjunto Excel del día";

  window.location.href =
    `mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

  // marcar como enviado y limpiar
  let db = getDB();
  let f = hoy();

  db = db.map(d=>{
    if(d.fecha===f){
      d.enviado=true;
      d.registros=[];
    }
    return d;
  });

  setDB(db);
  render();
}

// ===== BORRAR =====
function borrar(){
  if(!confirm("Borrar datos de hoy?")) return;

  let db = getDB();
  let f = hoy();

  db = db.map(d=>{
    if(d.fecha===f){
      d.registros=[];
    }
    return d;
  });

  setDB(db);
  render();
}

// INIT
render();

</script>
</body>
</html>
