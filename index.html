<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Carnes</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    padding: 20px;
}
input, button {
    padding: 8px;
    margin: 5px;
}
button {
    cursor: pointer;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ccc;
    padding: 8px;
}
th {
    background: #333;
    color: white;
}
</style>

</head>
<body>

<h2>Registro Diario de Carne</h2>

<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<input id="corte" placeholder="Corte de carne">
<input id="peso" type="number" placeholder="Peso (kg)">

<br>

<button onclick="guardar()">Guardar</button>
<button onclick="exportarExcel()">Descargar Excel</button>
<button onclick="enviarMail()">Enviar por Mail</button>
<button onclick="borrar()">Borrar Registros</button>

<table>
<thead>
<tr>
<th>Fecha</th>
<th>Hora</th>
<th>Nombre</th>
<th>Apellido</th>
<th>Corte</th>
<th>Peso</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script>

const clave = "registrosCarnes_v2";

function hoyClave() {
    const hoy = new Date();
    return hoy.toISOString().split("T")[0]; // YYYY-MM-DD
}

function obtenerDatos() {
    const data = JSON.parse(localStorage.getItem(clave)) || {};
    return data[hoyClave()] || [];
}

function guardarDatos(lista) {
    let data = JSON.parse(localStorage.getItem(clave)) || {};
    data[hoyClave()] = lista;
    localStorage.setItem(clave, JSON.stringify(data));
}

function guardar() {
    const nombre = document.getElementById("nombre").value;
    const apellido = document.getElementById("apellido").value;
    const corte = document.getElementById("corte").value;
    const peso = document.getElementById("peso").value;

    if (!nombre || !apellido || !corte || !peso) {
        alert("Completar todos los campos");
        return;
    }

    const ahora = new Date();

    const registro = {
        fecha: ahora.toLocaleDateString(),
        hora: ahora.toLocaleTimeString(),
        nombre,
        apellido,
        corte,
        peso
    };

    const datos = obtenerDatos();
    datos.push(registro);
    guardarDatos(datos);

    render();

    document.getElementById("nombre").value = "";
    document.getElementById("apellido").value = "";
    document.getElementById("corte").value = "";
    document.getElementById("peso").value = "";
}

function render() {
    const datos = obtenerDatos();
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    datos.forEach(d => {
        tabla.innerHTML += `
        <tr>
            <td>${d.fecha}</td>
            <td>${d.hora}</td>
            <td>${d.nombre}</td>
            <td>${d.apellido}</td>
            <td>${d.corte}</td>
            <td>${d.peso}</td>
        </tr>
        `;
    });
}

function exportarExcel() {
    const datos = obtenerDatos();

    if (datos.length === 0) {
        alert("No hay datos para exportar");
        return;
    }

    let contenido = `
    <table border="1">
    <tr>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Corte</th>
        <th>Peso</th>
    </tr>
    `;

    datos.forEach(d => {
        contenido += `
        <tr>
            <td>${d.fecha}</td>
            <td>${d.hora}</td>
            <td>${d.nombre}</td>
            <td>${d.apellido}</td>
            <td>${d.corte}</td>
            <td>${d.peso}</td>
        </tr>
        `;
    });

    contenido += "</table>";

    const blob = new Blob([contenido], { type: "application/vnd.ms-excel" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    const fecha = hoyClave();

    a.href = url;
    a.download = `registros_${fecha}.xls`;
    a.click();
}

function enviarMail() {
    const fecha = new Date().toLocaleDateString();

    const asunto = `Entregas de carne día: ${fecha}`;
    const cuerpo = "Se adjunta el archivo Excel con los registros del día.";

    // Abre cliente de mail (NO puede adjuntar automáticamente)
    window.location.href = `mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

function borrar() {
    if (!confirm("¿Seguro que querés borrar los registros de hoy?")) return;

    let data = JSON.parse(localStorage.getItem(clave)) || {};
    delete data[hoyClave()];
    localStorage.setItem(clave, JSON.stringify(data));

    render();
}

render();

</script>

</body>
</html>
