<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Carnes</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 20px;
  }
  h2 { color: #c0392b; margin-bottom: 6px; }
  .subtitulo { color: #888; font-size: 13px; margin-bottom: 20px; }

.form-box {
background: white;
padding: 20px;
border-radius: 8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
margin-bottom: 20px;
}
.fila {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-bottom: 14px;
}
.campo {
display: flex;
flex-direction: column;
flex: 1;
min-width: 150px;
}
.campo label {
font-size: 12px;
font-weight: bold;
color: #555;
margin-bottom: 4px;
text-transform: uppercase;
}
.campo input {
padding: 9px 11px;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 15px;
outline: none;
transition: border-color 0.2s;
}
.campo input:focus { border-color: #c0392b; }

.botones { display: flex; flex-wrap: wrap; gap: 10px; }

button {
padding: 10px 18px;
font-size: 13px;
font-weight: bold;
border: none;
border-radius: 5px;
cursor: pointer;
transition: background 0.15s;
}
.btn-guardar  { background: #c0392b; color: white; }
.btn-guardar:hover { background: #962d22; }
.btn-excel    { background: #27ae60; color: white; }
.btn-excel:hover { background: #1e8449; }
.btn-mail     { background: #2980b9; color: white; }
.btn-mail:hover { background: #1f6390; }
.btn-borrar   { background: #888; color: white; }
.btn-borrar:hover { background: #555; }

/* Aviso mail */
#aviso {
display: none;
background: #d6eaf8;
border: 1px solid #2980b9;
border-radius: 6px;
padding: 12px 16px;
margin-bottom: 16px;
font-size: 13px;
color: #1a5276;
}

/* Tabla */
.tabla-box {
background: white;
border-radius: 8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
overflow: hidden;
}
.tabla-top {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 16px;
background: #2d2d2d;
color: white;
font-size: 14px;
font-weight: bold;
}
#badge {
background: #c0392b;
color: white;
font-size: 12px;
padding: 2px 10px;
border-radius: 20px;
}
table { width: 100%; border-collapse: collapse; }
th {
background: #444;
color: white;
text-align: left;
padding: 10px 12px;
font-size: 12px;
text-transform: uppercase;
}
td { padding: 9px 12px; font-size: 14px; border-bottom: 1px solid #eee; color: #333; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fdf5f5; }
#fila-vacia td { text-align: center; padding: 30px; color: #bbb; font-style: italic; }
</style>

</head>
<body>

<h2>Registro Diario de Carnes</h2>
<div class="subtitulo" id="fecha-hoy"></div>

<div class="form-box">
  <div class="fila">
    <div class="campo">
      <label>Nombre</label>
      <input id="inp-nombre" placeholder="Ej: Juan">
    </div>
    <div class="campo">
      <label>Apellido</label>
      <input id="inp-apellido" placeholder="Ej: García">
    </div>
    <div class="campo">
      <label>Corte de carne</label>
      <input id="inp-corte" placeholder="Ej: Asado">
    </div>
    <div class="campo">
      <label>Peso (kg)</label>
      <input id="inp-peso" type="number" step="0.01" min="0.01" placeholder="Ej: 2.50">
    </div>
  </div>
  <div class="botones">
    <button class="btn-guardar" onclick="guardar()">✔ GUARDAR</button>
    <button class="btn-excel"   onclick="descargarExcel()">⬇ DESCARGAR EXCEL</button>
    <button class="btn-mail"    onclick="enviarMail()">✉ ENVIAR POR MAIL</button>
    <button class="btn-borrar"  onclick="borrar()">✕ BORRAR HOY</button>
  </div>
</div>

<div id="aviso">
  <strong>📎 Paso requerido:</strong> El archivo Excel se descargó automáticamente.
  Tu cliente de correo va a abrirse — adjuntá el archivo descargado antes de enviar.
</div>

<div class="tabla-box">
  <div class="tabla-top">
    <span>Registros del día</span>
    <span id="badge">0</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Corte</th>
        <th>Peso (kg)</th>
      </tr>
    </thead>
    <tbody id="cuerpo-tabla"></tbody>
  </table>
</div>

<script>

// ── Clave única por día en localStorage ──────────────────────
function claveHoy() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dia = String(d.getDate()).padStart(2, '0');
  return 'carnes_' + y + '_' + m + '_' + dia;
}

// ── Leer y escribir en localStorage ──────────────────────────
function leerDatos() {
  try {
    var raw = localStorage.getItem(claveHoy());
    return raw ? JSON.parse(raw) : [];
  } catch(e) {
    return [];
  }
}

function escribirDatos(lista) {
  localStorage.setItem(claveHoy(), JSON.stringify(lista));
}

// ── Fecha y hora del dispositivo ─────────────────────────────
function obtenerFecha() {
  var d = new Date();
  return d.toLocaleDateString('es-AR', {
    day: '2-digit', month: '2-digit', year: 'numeric'
  });
}

function obtenerHora() {
  var d = new Date();
  return d.toLocaleTimeString('es-AR', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
}

// ── Mostrar fecha de hoy en el encabezado ────────────────────
document.getElementById('fecha-hoy').textContent =
  new Date().toLocaleDateString('es-AR', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
  });

// ── GUARDAR ───────────────────────────────────────────────────
function guardar() {
  var nombre   = document.getElementById('inp-nombre').value.trim();
  var apellido = document.getElementById('inp-apellido').value.trim();
  var corte    = document.getElementById('inp-corte').value.trim();
  var peso     = document.getElementById('inp-peso').value.trim();

  if (!nombre || !apellido || !corte || !peso) {
    alert('Completá todos los campos antes de guardar.');
    return;
  }

  if (isNaN(parseFloat(peso)) || parseFloat(peso) <= 0) {
    alert('El peso debe ser un número mayor a 0.');
    return;
  }

  var registro = {
    fecha:    obtenerFecha(),   // fecha del dispositivo
    hora:     obtenerHora(),    // hora del dispositivo
    nombre:   nombre,
    apellido: apellido,
    corte:    corte,
    peso:     parseFloat(peso)
  };

  var datos = leerDatos();
  datos.push(registro);
  escribirDatos(datos);

  // Limpiar campos
  document.getElementById('inp-nombre').value   = '';
  document.getElementById('inp-apellido').value = '';
  document.getElementById('inp-corte').value    = '';
  document.getElementById('inp-peso').value     = '';
  document.getElementById('inp-nombre').focus();

  renderTabla();
}

// ── RENDER TABLA ──────────────────────────────────────────────
function renderTabla() {
  var datos  = leerDatos();
  var cuerpo = document.getElementById('cuerpo-tabla');
  var badge  = document.getElementById('badge');

  badge.textContent = datos.length + ' registro' + (datos.length !== 1 ? 's' : '');
  cuerpo.innerHTML  = '';

  if (datos.length === 0) {
    cuerpo.innerHTML =
      '<tr id="fila-vacia"><td colspan="7">Sin registros hoy. Ingresá el primero arriba.</td></tr>';
    return;
  }

  datos.forEach(function(d, i) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="color:#aaa;font-size:12px">' + (i + 1) + '</td>' +
      '<td>' + d.fecha    + '</td>' +
      '<td>' + d.hora     + '</td>' +
      '<td>' + d.nombre   + '</td>' +
      '<td>' + d.apellido + '</td>' +
      '<td>' + d.corte    + '</td>' +
      '<td>' + d.peso + ' kg</td>';
    cuerpo.appendChild(tr);
  });
}

// ── GENERAR EXCEL ─────────────────────────────────────────────
function generarExcel() {
  var datos = leerDatos();
  if (datos.length === 0) { alert('No hay registros para exportar.'); return null; }

  var filas = '';
  datos.forEach(function(d, i) {
    filas +=
      '<tr>' +
      '<td>' + (i+1)      + '</td>' +
      '<td>' + d.fecha    + '</td>' +
      '<td>' + d.hora     + '</td>' +
      '<td>' + d.nombre   + '</td>' +
      '<td>' + d.apellido + '</td>' +
      '<td>' + d.corte    + '</td>' +
      '<td>' + d.peso     + '</td>' +
      '</tr>';
  });

  var html =
    '<html><head><meta charset="UTF-8">' +
    '<style>' +
    'body{font-family:Arial;font-size:11pt}' +
    'h2{color:#c0392b}' +
    'table{border-collapse:collapse;width:100%}' +
    'th{background:#c0392b;color:white;padding:8px 10px;border:1px solid #999;text-align:left}' +
    'td{padding:6px 10px;border:1px solid #ccc}' +
    'tr:nth-child(even) td{background:#f9f9f9}' +
    '</style></head><body>' +

```
'<h2>Registro de Carnes &mdash; ' + obtenerFecha() + '</h2>' +
'<table><thead><tr>' +
'<th>#</th><th>Fecha</th><th>Hora</th>' +
'<th>Nombre</th><th>Apellido</th><th>Corte</th><th>Peso (kg)</th>' +
'</tr></thead><tbody>' + filas + '</tbody></table>' +
'</body></html>';
```

return { html: html, cantidad: datos.length };
}

function disparaDescarga(html) {
var blob = new Blob([html], { type: ‘application/vnd.ms-excel;charset=utf-8;’ });
var url  = URL.createObjectURL(blob);
var a    = document.createElement(‘a’);
a.href     = url;
a.download = ‘registro_carnes_’ + claveHoy().replace(‘carnes_’, ‘’) + ‘.xls’;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
}

// ── DESCARGAR EXCEL ───────────────────────────────────────────
function descargarExcel() {
var r = generarExcel();
if (!r) return;
disparaDescarga(r.html);
}

// ── ENVIAR POR MAIL ───────────────────────────────────────────
function enviarMail() {
var r = generarExcel();
if (!r) return;

// 1. Descargar Excel primero
disparaDescarga(r.html);

// 2. Mostrar aviso
var aviso = document.getElementById(‘aviso’);
aviso.style.display = ‘block’;
setTimeout(function() { aviso.style.display = ‘none’; }, 12000);

// 3. Abrir cliente de correo
var fecha  = obtenerFecha();
var asunto = ’Entregas de carne - ’ + fecha;
var cuerpo =
‘Buen dia,\n\n’ +
’Se adjunta el archivo Excel con los registros del dia ’ + fecha + ‘.\n’ +
’Total de registros: ’ + r.cantidad + ‘\n\n’ +
‘Saludos.’;

setTimeout(function() {
window.location.href =
‘mailto:?subject=’ + encodeURIComponent(asunto) +
‘&body=’           + encodeURIComponent(cuerpo);
}, 600);
}

// ── BORRAR ─────────────────────────────────────────────────────
function borrar() {
if (!confirm(’¿Seguro que querés borrar todos los registros de HOY?\nEsta acción no se puede deshacer.’)) return;
localStorage.removeItem(claveHoy());
renderTabla();
}

// ── ENTER para guardar ────────────────────────────────────────
document.addEventListener(‘keydown’, function(e) {
if (e.key === ‘Enter’) guardar();
});

// ── INICIO ────────────────────────────────────────────────────
renderTabla();

</script>
</body>
</html>
