<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Carnes</title>

<style>
body{font-family:Arial;background:#f0f0f0;padding:20px;}
.box{background:#fff;padding:20px;border-radius:8px;margin-bottom:20px;}
input{padding:8px;margin:5px;}
button{padding:10px;margin:5px;border:none;border-radius:5px;cursor:pointer;}
.guardar{background:#c0392b;color:#fff;}
.excel{background:#27ae60;color:#fff;}
.mail{background:#2980b9;color:#fff;}
.borrar{background:#888;color:#fff;}
table{width:100%;border-collapse:collapse;}
th,td{padding:8px;border-bottom:1px solid #ddd;}
</style>

</head>
<body>

<h2>Registro Diario de Carnes</h2>

<div class="box">
<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<input id="corte" placeholder="Corte">
<input id="peso" type="number" placeholder="Peso">

<br>

<button class="guardar" onclick="guardar()">Guardar</button>
<button class="excel" onclick="descargarExcel()">Excel</button>
<button class="mail" onclick="enviarMail()">Enviar Mail</button>
<button class="borrar" onclick="borrar()">Borrar</button>
</div>

<div class="box">
<table>
<thead>
<tr>
<th>#</th><th>Fecha</th><th>Hora</th>
<th>Nombre</th><th>Apellido</th><th>Corte</th><th>Peso</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script>

// ===== UTIL =====
function hoy(){
  return new Date().toISOString().split("T")[0];
}

function hora(){
  return new Date().toLocaleTimeString();
}

// ===== DB =====
function getDB(){
  return JSON.parse(localStorage.getItem("carnes_db") || "[]");
}

function setDB(db){
  localStorage.setItem("carnes_db", JSON.stringify(db));
}

// ===== OBTENER / CREAR DIA =====
function obtenerDia(db){
  let f = hoy();
  let dia = db.find(d => d.fecha === f);

  if(!dia){
    dia = {fecha:f, enviado:false, registros:[]};
    db.push(dia);
  }

  // mantener últimos 5 días
  if(db.length > 5){
    db.splice(0, db.length - 5);
  }

  return dia;
}

// ===== GUARDAR =====
function guardar(){
  let n = nombre.value.trim();
  let a = apellido.value.trim();
  let c = corte.value.trim();
  let p = parseFloat(peso.value);

  if(!n || !a || !c || isNaN(p) || p <= 0){
    alert("Completá bien los campos");
    return;
  }

  let db = getDB();
  let dia = obtenerDia(db);

  dia.registros.push({
    fecha:hoy(),
    hora:hora(),
    nombre:n,
    apellido:a,
    corte:c,
    peso:p
  });

  setDB(db); // 🔥 GUARDA REAL

  limpiar();
  render();
}

// ===== LIMPIAR INPUTS =====
function limpiar(){
  nombre.value="";
  apellido.value="";
  corte.value="";
  peso.value="";
}

// ===== TABLA =====
function render(){
  let db = getDB();
  let f = hoy();
  let dia = db.find(d => d.fecha === f);

  let html="";

  if(dia && dia.registros.length){
    dia.registros.forEach((r,i)=>{
      html += `<tr>
        <td>${i+1}</td>
        <td>${r.fecha}</td>
        <td>${r.hora}</td>
        <td>${r.nombre}</td>
        <td>${r.apellido}</td>
        <td>${r.corte}</td>
        <td>${r.peso}</td>
      </tr>`;
    });
  } else {
    html = "<tr><td colspan='7'>Sin registros</td></tr>";
  }

  tabla.innerHTML = html;
}

// ===== EXCEL =====
function generarExcel(){
  let db = getDB();
  let f = hoy();
  let dia = db.find(d => d.fecha === f);

  if(!dia || dia.registros.length === 0){
    alert("Sin datos");
    return null;
  }

  let filas = "";
  dia.registros.forEach((r,i)=>{
    filas += `<tr>
      <td>${i+1}</td>
      <td>${r.fecha}</td>
      <td>${r.hora}</td>
      <td>${r.nombre}</td>
      <td>${r.apellido}</td>
      <td>${r.corte}</td>
      <td>${r.peso}</td>
    </tr>`;
  });

  return `
  <html>
  <body>
  <table border="1">
  <tr>
  <th>#</th><th>Fecha</th><th>Hora</th>
  <th>Nombre</th><th>Apellido</th><th>Corte</th><th>Peso</th>
  </tr>
  ${filas}
  </table>
  </body>
  </html>`;
}

function descargarExcel(){
  let html = generarExcel();
  if(!html) return;

  let blob = new Blob([html], {type:'application/vnd.ms-excel'});
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "registro_carnes.xls";
  a.click();

  URL.revokeObjectURL(url);
}

// ===== MAIL =====
function enviarMail(){
  let html = generarExcel();
  if(!html) return;

  descargarExcel();

  let asunto = "Registro Carnes";
  let cuerpo = "Adjunto Excel del día.";

  window.location.href =
    `mailto:?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

  // 🔥 limpiar automáticamente después de enviar
  let db = getDB();
  let f = hoy();

  db = db.map(d=>{
    if(d.fecha === f){
      return {fecha:f, enviado:true, registros:[]};
    }
    return d;
  });

  setDB(db);
  render();
}

// ===== BORRAR =====
function borrar(){
  if(!confirm("Borrar datos de hoy?")) return;

  let db = getDB();
  let f = hoy();

  db = db.map(d=>{
    if(d.fecha === f){
      d.registros = [];
    }
    return d;
  });

  setDB(db);
  render();
}

// INIT
render();

</script>
</body>
</html>
</html>
